# CI workflow for the SauceDemo starter tests. Not enabled: GitHub only runs workflows
# from .github/workflows/ at the repository root. Copy it there to turn it on.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly, 03:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: examples/saucedemo-test-design/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: examples/saucedemo-test-design/starter/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Smoke (push)
        if: github.event_name == 'push'
        run: npx playwright test --grep @push --project=chromium

      - name: P1 regression (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep "@push|@pr" --project=chromium

      - name: Full regression (nightly or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            examples/saucedemo-test-design/starter/playwright-report/
            examples/saucedemo-test-design/starter/results/
          retention-days: 14
